services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml
      - prometheus_data:/prometheus

    depends_on:
      - alertmanager

    networks:
      - monitoring

  alertmanager-config-generator:
    image: python:3.12-alpine
    container_name: alertmanager-config-generator
    restart: "no"

    working_dir: /app

    volumes:
      - ./scripts:/app/scripts:ro
      - ./email:/app/email:ro
      - ./secrets/email_smtp_password.txt:/app/secrets/email_smtp_password.txt:ro
      - ./alertmanager.yml.tmpl:/app/alertmanager.yml.tmpl:ro
      - ./alertmanager.yml:/app/alertmanager.yml

    command:
      - python
      - /app/scripts/generate_alertmanager_config.py

    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped

    ports:
      - "9093:9093"

    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./secrets/telegram_bot_token.txt:/etc/alertmanager/secrets/telegram_bot_token:ro
      - ./secrets/email_smtp_password.txt:/etc/alertmanager/secrets/email_smtp_password:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

    depends_on:
      alertmanager-config-generator:
        condition: service_completed_successfully

    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

    depends_on:
      - prometheus

    networks:
      - monitoring


volumes:
  prometheus_data:
  grafana_data:


networks:
  monitoring: