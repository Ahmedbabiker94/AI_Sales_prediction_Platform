global:
  scrape_interval: 5s
  evaluation_interval: 5s


alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093


rule_files:
  - /etc/prometheus/prometheus-alerts.yml


scrape_configs:

  - job_name: "sales-forecast-platform"

    metrics_path: /metrics

    static_configs:
      - targets:
          - host.docker.internal:8000